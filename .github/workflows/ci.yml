name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

# 建置只需讀取碼，不需寫入
permissions:
  contents: read

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # 一次建置 lib + bin + examples（+ tests），確保整個 crate 編得過
      - name: Build (release, all targets)
        run: cargo build --release --target ${{ env.TARGET }} --all-targets
