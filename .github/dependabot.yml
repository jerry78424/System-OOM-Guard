version: 2
updates:
  # 升級 workflow 裡引用的 action（checkout / rust-toolchain / rust-cache / action-gh-release）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"

  # 升級 Rust 相依（Cargo.toml / Cargo.lock）
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
